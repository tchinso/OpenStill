<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OpenStill</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="header">
        <div class="brand-mark" aria-hidden="true">✓</div>
        <div><h1>OpenStill</h1><p>선택한 텍스트의 변화를 놓치지 마세요</p></div>
        <button id="openDashboard" class="ghost" type="button" aria-label="관리 화면 열기">↗</button>
      </header>

      <section class="picker-card">
        <p class="eyebrow">현재 페이지</p>
        <h2 id="pageTitle">페이지 확인 중…</h2>
        <p id="pageUrl" class="url"></p>
        <button id="pickElement" class="primary" type="button">이 페이지에서 요소 선택</button>
        <p class="permission-note">선택을 시작하면 이 사이트에 대해서만 접근 권한을 요청합니다. 저장하지 않고 닫으면 권한도 정리합니다.</p>
        <p id="message" class="message" role="alert"></p>
      </section>

      <section class="overview" aria-label="모니터 요약">
        <div><span id="monitorCount">0</span><small>추적 중</small></div>
        <div class="changed"><span id="changedCount">0</span><small>확인할 변경</small></div>
      </section>

      <section class="recent-section">
        <div class="section-title"><h2>최근 변경</h2><button id="manage" class="text-button" type="button">전체 관리</button></div>
        <div id="recentList" class="recent-list"></div>
      </section>

      <footer>정기 확인은 허용한 사이트를 비활성 임시 탭에서 렌더링해 비교합니다.</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
